#
# Workspace root for the *vendored* Gleam crates. Generated by `vendor.sh`;
# do not edit by hand. See that script for why it exists.

[workspace]
resolver = "2"
members = [
  "compiler-core",
  "erlang-generation",
  "erlang-term-format",
  "format",
  "hexpm",
  "pretty-arena",
  "src-span",
]

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
imbl = { version = "7", features = ["serde"] }
itertools = "0"
regex = "1"
termcolor = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "1.1"
strum = { version = "0", features = ["derive"] }
tar = "0"
flate2 = "1"
tracing = "0"
async-trait = "0"
http = "1"
futures = "0"
debug-ignore = "1"
base16 = "0"
lsp-server = "0"
lsp-types = { package = "gen-lsp-types", version = "0.5.0", features = ["url"] }
ecow = "0"
camino = "1"
thiserror = "2"
pretty_assertions = "1"
insta = { version = "1", features = ["glob"] }
vec1 = "1"
ignore = "0"
num-bigint = { version = "0.5.1", features = ["serde"] }
num-traits = "0.2.19"
unicode-segmentation = "1.13.2"
xxhash-rust = { version = "0", features = ["xxh3"] }
src-span = { path = "./src-span" }
