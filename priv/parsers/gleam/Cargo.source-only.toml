# Manifest for the **source-only** Gleam bridge, shipped by `HEX_BUILD=1`.
#
# It is `Cargo.toml` minus the vendored crates that build does not carry.
# Cargo resolves a `path` dependency's manifest even when the feature that
# enables it is off, so an `optional = true` path dependency still fails with
#
#     error: no matching package named `gleam-core` found
#     location searched: vendor/compiler-core
#
# in a package that ships without `vendor/`. Removing the dependency entries is
# the only way to make that package build, which is why this file exists rather
# than a feature flag alone.
#
# `mix.exs` copies this over `Cargo.toml` when `HEX_BUILD=1` is set, so the
# unpacked package is buildable as shipped:
#
#     cargo build --release --no-default-features --features external-gleam
#
# Keep it in sync with `Cargo.toml` whenever a non-vendored dependency changes.

[package]
name = "metastatic-gleam-parser"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Gleam AST bridge for Metastatic: formats Gleam source and renders MetaAST back to it."
license = "GPL-3.0"

[[bin]]
name = "metastatic-gleam-parser"
path = "src/main.rs"

# Only `external-gleam` is meaningful here: `vendored` would need the crates
# this manifest deliberately omits. `default` is left empty so a bare
# `cargo build` in the unpacked package does the right thing.
[features]
default = ["external-gleam"]
vendored = []
external-gleam = []

[dependencies]
# UTF-8 paths, which is what the printer's input type wants.
camino = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = true
