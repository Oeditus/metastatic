name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  MIX_ENV: test

jobs:
  test:
    name: Test (Elixir ${{matrix.elixir}} / OTP ${{matrix.otp}})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        elixir: ['1.20']
        otp: ['29']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: priv/parsers/ruby

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: priv/parsers/javascript/package-lock.json

      - name: Install JavaScript parser dependencies
        run: npm ci
        working-directory: priv/parsers/javascript

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.x
          dune-cache: true

      - name: Install Dune
        run: opam install -y dune

      - name: Build March OCaml parser
        run: opam exec -- dune build
        working-directory: priv/parsers/march

      - name: Set up Cure
        uses: cure-lang/setup-cure@v1

      - name: Set up Rust for packaged SQL parser smoke tests
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Check Go bridge formatting
        run: test -z "$(gofmt -l .)"
        working-directory: priv/parsers/go

      - name: Test and vet the Go parser bridge
        run: |
          go test ./...
          go vet ./...
        working-directory: priv/parsers/go

      # The Rust adapter shells out to `priv/parsers/rust`. Without this step the
      # first test that touches it pays a cold `cargo build` (and the `ra`
      # backend is unavailable because `cargo run` uses default features).
      - name: Build the Rust parser bridge
        run: cargo build --release --locked
        working-directory: priv/parsers/rust

      # The Gleam adapter shells out to `priv/parsers/gleam`, which links
      # against the *vendored* Gleam compiler crates. Building it here keeps the
      # adapter's tests off the cold-build path and proves the vendored tree
      # compiles on a clean checkout.
      - name: Build the Gleam parser bridge
        run: cargo build --release --locked
        working-directory: priv/parsers/gleam

      - name: Test the Gleam parser bridge
        run: cargo test --release --locked
        working-directory: priv/parsers/gleam

      # The source-only build is what `HEX_BUILD=1` ships. It must compile
      # without `vendor/`, so it is built from the source-only manifest exactly
      # as an unpacked package would be.
      - name: Build the source-only Gleam bridge
        run: |
          mkdir -p /tmp/gleam-source-only/src
          cp Cargo.source-only.toml /tmp/gleam-source-only/Cargo.toml
          cp src/*.rs /tmp/gleam-source-only/src/
          cargo build --release --manifest-path /tmp/gleam-source-only/Cargo.toml
        working-directory: priv/parsers/gleam

      - name: Check the source-only bridge reports the right build
        run: |
          /tmp/gleam-source-only/target/release/metastatic-gleam-parser selftest x \
            | grep -q '"build":"external-gleam"'
        working-directory: priv/parsers/gleam

      # The source-only package must be buildable as shipped: the manifest swap
      # is the step most likely to break silently.
      - name: Build the source-only Hex package
        run: |
          mix metastatic.package.gleam --source-only -o /tmp/pkg-source-only
          test -f /tmp/pkg-source-only/priv/parsers/gleam/Cargo.toml
          test ! -d /tmp/pkg-source-only/priv/parsers/gleam/vendor
          ! grep -q 'gleam-core = ' /tmp/pkg-source-only/priv/parsers/gleam/Cargo.toml

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            priv/parsers/rust/target
            priv/parsers/gleam/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('priv/parsers/rust/Cargo.lock', 'priv/parsers/gleam/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile code (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test

      - name: Report experimental languages
        # LFE is flagged `experimental` in `Metastatic.Languages.Builtin`
        # because its reader/compiler are not part of OTP. LFE is installed
        # as a development/test dependency and exercised in this job.
        run: |
          mix run --no-start -e '
            experimental = Metastatic.Languages.Builtin.experimental_languages()
            IO.puts("Experimental languages (external toolchains): #{inspect(experimental)}")

            unless :lfe in experimental do
              IO.puts(:stderr, "::error::LFE must be flagged experimental")
              System.halt(1)
            end

            IO.puts("LFE toolchain available in this runner: #{Metastatic.Adapters.Lfe.available?()}")
          '

      - name: Run LFE adapter tests
        # The unit tests run everywhere; the toolchain-dependent and
        # conformance suites self-skip when LFE is absent (see
        # `test/metastatic/adapters/lfe_conformance_test.exs`).
        run: mix test test/metastatic/adapters/lfe_test.exs test/metastatic/adapters/lfe_conformance_test.exs

      - name: Run tests with coverage (enforces minimum via coveralls.json)
        run: mix coveralls

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20'
          otp-version: '29'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-quality-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-quality-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile for dialyzer
        run: mix compile

      - name: Restore PLT cache
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-

      - name: Run Dialyzer
        run: mix dialyzer --format github

      - name: Run Credo (static analysis)
        run: mix credo --strict

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '27'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-docs-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-docs-

      - name: Install dependencies
        run: MIX_ENV=dev mix deps.get

      - name: Generate documentation
        run: MIX_ENV=dev mix docs

      - name: Check documentation coverage
        run: |
          echo "Checking that all public functions have @doc..."
          # This is a placeholder - actual implementation would grep for missing @doc

  plugin_example:
    name: Third-party plug-in example
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20'
          otp-version: '29'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            examples/third_party_plugin/deps
            examples/third_party_plugin/_build
          key: ${{ runner.os }}-mix-plugin-${{ hashFiles('**/mix.lock', 'examples/third_party_plugin/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-plugin-

      - name: Install dependencies
        run: mix deps.get

      - name: Run the third-party plug-in example
        # This is the acceptance test for the plug-in architecture: a separate
        # Mix application adds the `:lisp` language to Metastatic without
        # editing a single file in Metastatic's source tree.
        run: |
          cd examples/third_party_plugin
          mix deps.get
          mix test

  quality_gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [quality, test, docs, plugin_example]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.docs.result }}" != "success" ] || \
             [ "${{ needs.plugin_example.result }}" != "success" ]; then
            echo "Quality gate failed"
            exit 1
          fi
          echo "Quality gate passed"
